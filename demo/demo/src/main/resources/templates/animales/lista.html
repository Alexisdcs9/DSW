<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Lista Animales</title>
</head>
<body>

<body class="bg-white" style="padding-top: 70px;">

<nav class="navbar navbar-expand bg-primary fixed-top" data-bs-theme="dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/animales}">Animalia</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" th:href="@{/animales}">Listar</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/animales/crear}">Crear</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/animales/editar}">Editar</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <h1>Lista Animales</h1>


    <table class="table">
        <thead>
        <tr>
            <th scope="col">id</th>
            <th scope="col">nombre</th>
            <th scope="col">averageLife</th>
            <th scope="col">extinct</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="animal : ${animales}">
            <th scope="row" th:text="${animal.id}">1</th>
            <td th:text="${animal.nombre}"></td>
            <td th:text="${animal.vidaMedia}"></td>
            <td th:text="${animal.extinto}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
