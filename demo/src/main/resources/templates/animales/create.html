<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Crear Animales</title>
</head>
<body>
    <body class="bg-white" style="padding-top: 70px;">

    <nav class="navbar navbar-expand bg-primary fixed-top" data-bs-theme="dark">
        <div class="container mt-4">
            <a class="navbar-brand" th:href="@{/animales}">Animalia</a>
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" th:href="@{/animales}">Listar</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/animales/create}">Crear</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/animales/edit}">Editar</a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container mt-4">
        <form action="#"
            th:action="@{/animales/create}"
            th:object="${animal}"
            method="post">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Name</label>
                            <input type="text" id="nombre" class="form-control" th:field="*{nombre}">
                        </div>
                            <div class="mb-3">
                                <label for="vidaMedia" class="form-label">Vida media</label>
                                <input th:classappend="${#fields.hasErrors('vidaMedia')} ? 'is-invalid'"
                                       type="number" class="form-control" id="vidaMedia" th:field="*{vidaMedia}">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('vidaMedia')}" th:errors="*{vidaMedia}"></div>
                            </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" id="extinto" class="form-check-input" th:field="*{extinto}">
                            <label for="extinto" class="form-check-label">Extint</label>
                        </div>
                        <button type="submit" class="btn btn-primary">Send</button>
                    </div>
                </div>
        </form>

    </div>
</body>
</html>
